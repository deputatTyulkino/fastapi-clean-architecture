<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding: 40px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius: 12px; overflow:hidden;">
            <!-- Header -->
            <tr>
              <td style="padding: 32px 40px 0 40px; text-align:center;">
                <h1 style="margin:0; font-size: 20px; color:#18181b;">YourApp</h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 24px 40px 8px 40px; text-align:center;">
                <p style="margin:0 0 8px 0; font-size:16px; color:#3f3f46;">Подтвердите ваш email</p>
                <p style="margin:0; font-size:14px; color:#71717a;">Введите этот код, чтобы завершить регистрацию</p>
              </td>
            </tr>

            <!-- Code -->
            <tr>
              <td style="padding: 24px 40px; text-align:center;">
                <div style="display:inline-block; background-color:#f4f4f5; border-radius:8px; padding: 16px 32px;">
                  <span style="font-size:32px; font-weight:700; letter-spacing:8px; color:#18181b;">{{ code }}</span>
                </div>
              </td>
            </tr>

            <!-- Footer note -->
            <tr>
              <td style="padding: 8px 40px 32px 40px; text-align:center;">
                <p style="margin:0; font-size:13px; color:#a1a1aa;">Код действителен 10 минут. Если вы не запрашивали код — просто проигнорируйте это письмо.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
